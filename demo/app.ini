; Hamerschlag's demo: a read-only Forgejo with made-up people and projects,
; thrown away and rebuilt from demo/seed.mjs on every deploy. Nobody signs in;
; the seed works through a one-time admin token. The web server in front also
; blocks the sign-in routes and every write (see the README's Demo section).
;
; dev/run.sh copies this and the theme into the data folder's custom/ before
; Forgejo starts, and Forgejo adds its own secrets to the copy.
; The site's own name, as on any Forgejo running the theme; the line under it
; is demo/templates/custom/hamerschlag/site_line.tmpl
APP_NAME = Forgejo Hamerschlag Theme Demo
RUN_MODE = prod

[server]
PROTOCOL = http
HTTP_PORT = 3000
; The service description is the site's root; the demo is at /demo/, and
; the web server takes the prefix off before Forgejo sees the request
ROOT_URL = https://hamerschlag.andrew.cmu.edu/demo/
; No SSH: cloning is over HTTPS only
DISABLE_SSH = true
START_SSH_SERVER = false
; No outside calls (Gravatar, fonts from Forgejo's CDN choices)
OFFLINE_MODE = true
LFS_START_SERVER = false

[database]
DB_TYPE = sqlite3

[security]
INSTALL_LOCK = true

[service]
; No sign-ups and no sign-in, by form, basic auth or OpenID
DISABLE_REGISTRATION = true
SHOW_REGISTRATION_BUTTON = false
ENABLE_INTERNAL_SIGNIN = false
ENABLE_BASIC_AUTHENTICATION = false
ENABLE_NOTIFY_MAIL = false
DEFAULT_KEEP_EMAIL_PRIVATE = true
REQUIRE_SIGNIN_VIEW = false

[openid]
ENABLE_OPENID_SIGNIN = false
ENABLE_OPENID_SIGNUP = false

[oauth2]
; Forgejo as a sign-in provider for other apps: off
ENABLED = false

[mailer]
ENABLED = false

[federation]
ENABLED = false

[actions]
ENABLED = false

[api]
ENABLE_SWAGGER = false

[picture]
DISABLE_GRAVATAR = true
ENABLE_FEDERATED_AVATAR = false

[repository]
; Cloning over HTTPS stays on; pushing is blocked by the web server
DISABLE_HTTP_GIT = false
DEFAULT_BRANCH = main

[ui]
; hamerschlag-demo is the theme without the Sign In link (demo/)
THEMES = hamerschlag-demo
DEFAULT_THEME = hamerschlag-demo

[other]
SHOW_FOOTER_VERSION = false
SHOW_FOOTER_POWERED_BY = false
SHOW_FOOTER_TEMPLATE_LOAD_TIME = false

[cron.update_checker]
ENABLED = false

[log]
LEVEL = Warn
